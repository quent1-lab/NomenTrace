<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nomentrace</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="entete">
    <div class="entete__marque">
      <button type="button" class="entete__menu" id="bascule-menu" aria-controls="menu-principal">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="entete__titre">Nomentrace</span>
      <span class="entete__projet" id="nom-projet"></span>
    </div>
    <div class="recherche-globale" id="recherche-globale"></div>
    <span class="etat-export" id="etat-export" title="État de l'export Excel"></span>
  </header>

  <div class="bandeau-erreur" id="bandeau-erreur" role="alert" hidden>
    <span id="bandeau-erreur-texte"></span>
    <button type="button" class="bandeau-erreur__fermer" id="bandeau-erreur-fermer"
            aria-label="Fermer le message">×</button>
  </div>

  <div class="bandeau-avertissement" id="bandeau-avertissement" role="status" hidden>
    <ul id="bandeau-avertissement-liste"></ul>
    <button type="button" class="bandeau-erreur__fermer" id="bandeau-avertissement-fermer"
            aria-label="Fermer le message">×</button>
  </div>

  <div class="cadre">
    <nav class="menu" id="menu-principal" aria-label="Navigation principale">
      <a class="menu__lien" href="#/" data-route="/" title="Tableau de bord">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg><span class="menu__texte">Tableau de bord</span></a>
      <a class="menu__lien" href="#/blocs" data-route="/blocs" title="Blocs">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span class="menu__texte">Blocs</span></a>
      <a class="menu__lien" href="#/ensembles" data-route="/ensembles" title="Ensembles">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg><span class="menu__texte">Ensembles</span></a>
      <a class="menu__lien" href="#/composants" data-route="/composants" title="Composants">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg><span class="menu__texte">Composants</span></a>
      <a class="menu__lien" href="#/achats" data-route="/achats" title="Achats">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5M9 20h.01M18 20h.01"/></svg><span class="menu__texte">Achats</span></a>
      <a class="menu__lien" href="#/stock" data-route="/stock" title="Stock">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l8-4 8 4v12H4zM4 8h16M9 20v-6h6v6"/></svg><span class="menu__texte">Stock</span></a>
      <a class="menu__lien" href="#/attributs" data-route="/attributs" title="Attributs">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8L3 12zM7.5 7.5h.01"/></svg><span class="menu__texte">Attributs</span></a>
      <a class="menu__lien" href="#/imports" data-route="/imports" title="Imports">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M4 15v5h16v-5"/></svg><span class="menu__texte">Imports</span></a>
      <a class="menu__lien" href="#/parametres" data-route="/parametres" title="Paramètres">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 5v4M8 15v4"/></svg><span class="menu__texte">Paramètres</span></a>
      <!-- Accès au code source demandé par la licence AGPL-3.0 (article 13). -->
      <a class="menu__source" href="https://github.com/quent1-lab/NomenTrace"
         target="_blank" rel="noopener noreferrer" title="Code source · AGPL-3.0">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg><span class="menu__texte">Code source · AGPL-3.0</span></a>
    </nav>
    <main class="contenu" id="contenu"></main>
  </div>

  <script src="/vendor/chart.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
